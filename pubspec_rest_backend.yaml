# Add these dependencies to your existing pubspec.yaml
# This is a reference list – copy/paste into your actual pubspec.yaml

dependencies:
  flutter:
    sdk: flutter

  # ===== NETWORKING =====
  dio: ^5.4.0                              # HTTP client
  dio_smart_retry: ^6.1.0                  # Auto-retry logic (optional but recommended)

  # ===== STATE MANAGEMENT =====
  flutter_riverpod: ^2.4.0                 # State management
  riverpod_annotation: ^2.3.0              # Annotations for Riverpod

  # ===== SERIALIZATION =====
  json_annotation: ^4.8.1                  # JSON annotations
  freezed_annotation: ^2.4.1               # Optional: better immutability + copyWith

  # ===== SECURE STORAGE =====
  flutter_secure_storage: ^9.0.0           # Token storage

  # ===== LOGGING & DEBUGGING =====
  logger: ^2.1.0                           # Pretty logging (optional)

  # ===== UTILITIES =====
  intl: ^0.19.0                            # DateTime formatting
  uuid: ^4.0.0                             # ID generation (optional)

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ===== CODE GENERATION =====
  build_runner: ^2.4.6                     # Required for json_serializable
  json_serializable: ^6.7.1                # Generate fromJson/toJson
  freezed: ^2.4.5                          # Generate freezed classes (optional)
  riverpod_generator: ^2.3.5               # Generate Riverpod providers (optional)

flutter:
  uses-material-design: true
